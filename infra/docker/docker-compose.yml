# BITBIT Development Environment
# PostgreSQL + Redis (Faz 2 test ortamı)

services:
  postgres:
    image: postgres:16-alpine
    container_name: bitbit-postgres
    environment:
      POSTGRES_USER: bitbit
      POSTGRES_PASSWORD: bitbit
      POSTGRES_DB: bitbit
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-EXEC', 'pg_isready -U bitbit']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bitbit-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
